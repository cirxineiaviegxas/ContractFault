name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Go analyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build CLI
        run: go build -o bin/contractfault ./cmd/contractfault
      - name: Contract gate (expect rupture, exit 2)
        run: |
          set +e
          ./bin/contractfault \
            -old examples/contracts/orders-v1.json \
            -new examples/contracts/orders-v2.json \
            -consumers "examples/consumers/*.json" \
            -format json -out report.json
          code=$?
          echo "analyzer exit code: $code"
          test "$code" -eq 2

  viewer:
    name: TypeScript viewer
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
