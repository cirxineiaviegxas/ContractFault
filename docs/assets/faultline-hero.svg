<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="cf-hero-title cf-hero-desc">
  <title id="cf-hero-title">contractfault faultline</title>
  <desc id="cf-hero-desc">Two crustal plates separated by a glowing fault rift, with a seismograph trace and two epicenter pulses sweeping across it, standing for API contract changes classified as breaking, additive, or behavioral and mapped to each consumer.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="rift" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e5484d" stop-opacity="0" />
      <stop offset="50%" stop-color="#e5484d" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#f5a623" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="900" height="300" fill="url(#sky)" />

  <path d="M0 130 L180 130 L210 118 L340 118 L370 132 L520 132 L560 116 L700 116 L740 130 L900 130 L900 0 L0 0 Z"
        fill="#21262d" stroke="#30363d" stroke-width="1">
    <animateTransform attributeName="transform" type="translate"
                      values="0 0; 0 -3; 0 0" dur="4s" repeatCount="indefinite" />
  </path>

  <path d="M0 170 L200 170 L230 182 L360 182 L390 168 L540 168 L580 184 L720 184 L760 170 L900 170 L900 300 L0 300 Z"
        fill="#1c2128" stroke="#30363d" stroke-width="1">
    <animateTransform attributeName="transform" type="translate"
                      values="0 0; 0 3; 0 0" dur="4s" repeatCount="indefinite" />
  </path>

  <rect x="0" y="146" width="900" height="8" fill="url(#rift)">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.6s" repeatCount="indefinite" />
  </rect>

  <polyline fill="none" stroke="#58a6ff" stroke-width="2"
            points="0,150 90,150 120,110 150,190 180,150 300,150 330,96 360,206 390,150 520,150 555,120 585,182 615,150 760,150 795,104 825,196 855,150 900,150">
    <animate attributeName="stroke-opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite" />
    <animateTransform attributeName="transform" type="translate"
                      values="-30 0; 30 0; -30 0" dur="6s" repeatCount="indefinite" />
  </polyline>

  <circle cx="330" cy="150" r="6" fill="#e5484d">
    <animate attributeName="r" values="6;22;6" dur="2.2s" repeatCount="indefinite" />
    <animate attributeName="fill-opacity" values="0.9;0;0.9" dur="2.2s" repeatCount="indefinite" />
  </circle>
  <circle cx="585" cy="150" r="5" fill="#f5a623">
    <animate attributeName="r" values="5;18;5" dur="2.8s" repeatCount="indefinite" />
    <animate attributeName="fill-opacity" values="0.9;0;0.9" dur="2.8s" repeatCount="indefinite" />
  </circle>

  <text x="40" y="60" font-family="monospace" font-size="34" fill="#c9d1d9" font-weight="bold">contractfault</text>
  <text x="42" y="88" font-family="monospace" font-size="15" fill="#8b949e">API contract consumer-impact analyzer, a seismic fault laboratory</text>
  <text x="40" y="270" font-family="monospace" font-size="13" fill="#58a6ff">breaking, additive, behavioral, mapped to every consumer along the fault</text>
</svg>
